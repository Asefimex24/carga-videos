<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard de Evidencias - ASEFI</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- DataTables Bootstrap 5 CSS (Faltaba en tu <head>) -->
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="estilo.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <!-- vh-100 + flex-column + overflow-hidden fijan toda la app al alto exacto de la pantalla -->
  <body class="vh-100 d-flex flex-column overflow-hidden">
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark navbar-custom py-2.5 flex-shrink-0 shadow-sm">
      <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 fw-bold fs-6 d-flex align-items-center gap-2">
          <i class="bi bi-camera-video-fill text-primary"></i>
          Videos de Desembolso
        </span>

        <a href="../" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1.5" style="font-size: 0.8rem">
          <i class="bi bi-arrow-left"></i>
          <span>Regresar al menú</span>
        </a>
      </div>
    </nav>

    <!-- CONTENEDOR FLUIDO QUE OCUPA EL RESTO DE LA PANTALLA -->
    <main class="container-fluid px-4 py-3 flex-grow-1 d-flex flex-column overflow-hidden">
      <!-- FILA DE KPIs COMPACTA (flex-shrink-0 para que nunca se aplaste) -->
      <div class="row g-3 mb-3 flex-shrink-0">
        <div class="col-6 col-lg-3">
          <div class="card card-stats">
            <div class="card-body py-2.5 px-3 d-flex align-items-center justify-content-between">
              <div>
                <div class="stat-label">Total Créditos</div>
                <h2 class="stat-value" id="totalRegistros">0</h2>
              </div>
              <div class="stat-icon bg-primary-subtle text-primary">
                <i class="bi bi-folder2-open"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6 col-lg-3">
          <div class="card card-stats">
            <div class="card-body py-2.5 px-3 d-flex align-items-center justify-content-between">
              <div>
                <div class="stat-label">Presentación</div>
                <h2 class="stat-value" id="totalPresentacion">0</h2>
              </div>
              <div class="stat-icon bg-info-subtle text-info">
                <i class="bi bi-person-video3"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6 col-lg-3">
          <div class="card card-stats">
            <div class="card-body py-2.5 px-3 d-flex align-items-center justify-content-between">
              <div>
                <div class="stat-label">Firma Contrato</div>
                <h2 class="stat-value" id="totalContrato">0</h2>
              </div>
              <div class="stat-icon bg-success-subtle text-success">
                <i class="bi bi-file-earmark-play"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6 col-lg-3">
          <div class="card card-stats">
            <div class="card-body py-2.5 px-3 d-flex align-items-center justify-content-between">
              <div>
                <div class="stat-label">Firma Aval(es)</div>
                <h2 class="stat-value" id="totalAval">0</h2>
              </div>
              <div class="stat-icon bg-warning-subtle text-warning">
                <i class="bi bi-person-check"></i>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TARJETA DE TABLA (flex-grow-1 ocupa exactamente el espacio sobrante) -->
      <div class="card table-card flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="card-header bg-white py-2.5 px-3 border-bottom d-flex align-items-center justify-content-between flex-shrink-0">
          <h6 class="mb-0 fw-bold text-slate-800 d-flex align-items-center gap-2">
            <i class="bi bi-table text-primary"></i>
            Evidencias Registradas
          </h6>
          <span class="text-muted small">Usa el buscador para filtrar por cliente, sucursal o # crédito</span>
        </div>

        <div class="card-body p-3 flex-grow-1 d-flex flex-column overflow-hidden">
          <table id="tablaVideos" class="table table-hover align-middle mb-0" style="width: 100%">
            <thead>
              <tr>
                <th>ID</th>
                <th>Fecha-Registro</th>
                <th>Sucursal</th>
                <th>Cliente</th>
                <th>#Crédito</th>
                <th class="text-center">Presentación</th>
                <th class="text-center">Firma</th>
                <th class="text-center">Firma-Aval</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <script src="app.js"></script>
    <script src="modal.js"></script>

    <!-- MODAL REPRODUCTOR -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg overflow-hidden">
          <div class="modal-header bg-dark text-white border-secondary py-2.5">
            <h6 class="modal-title fw-semibold mb-0">Reproductor de Video</h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body bg-black p-0 d-flex justify-content-center align-items-center">
            <video id="videoPlayer" controls preload="metadata" style="width: 100%; max-height: 75vh; object-fit: contain; display: block">Tu navegador no soporta video HTML5.</video>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
