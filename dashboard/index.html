<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard de Evidencias</title>

    <!-- Google Fonts: Inter para mejor legibilidad en tamaños pequeños -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="estilo.css" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <nav class="navbar navbar-dark navbar-custom shadow-sm">
      <div class="container-fluid px-4">
        <span class="navbar-brand mb-0">
          <i class="bi bi-camera-video-fill"></i>
          Videos de Desembolso
        </span>
      </div>
    </nav>

    <div class="container-fluid px-4 py-3">
      <!-- KPIs -->
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <div class="card card-stats">
            <div class="card-body">
              <div>
                <div class="stat-label">Total Registros</div>
                <h2 class="stat-value" id="totalRegistros">0</h2>
              </div>
              <div class="stat-icon">
                <i class="bi bi-folder2-open"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- <div class="col-md-4">
          <div class="card card-stats">
            <div class="card-body">
              <div>
                <div class="stat-label">Videos Presentación</div>
                <h2 class="stat-value" id="totalPresentacion">0</h2>
              </div>
              <div class="stat-icon">
                <i class="bi bi-person-video3"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card card-stats">
            <div class="card-body">
              <div>
                <div class="stat-label">Videos Contrato</div>
                <h2 class="stat-value" id="totalContrato">0</h2>
              </div>
              <div class="stat-icon">
                <i class="bi bi-file-earmark-play"></i>
              </div>
            </div>
          </div>
        </div> -->
      </div>

      <!-- Tabla de Evidencias -->
      <div class="card table-card">
        <div class="card-header">
          <h5 class="mb-0">
            <i class="bi bi-table me-1 text-primary"></i>
            Evidencias Registradas
          </h5>
        </div>

        <div class="card-body p-3">
          <div class="table-responsive">
            <table id="tablaVideos" class="table table-hover align-middle" style="width: 100%">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Fecha</th>
                  <th>Sucursal</th>
                  <th>Cliente</th>
                  <th>#Crédito</th>
                  <th>Presentación</th>
                  <th>Firma</th>
                  <th>Firma-Aval</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <script src="app.js"></script>
    <script src="modal.js"></script>

    <!-- Modal dentro del body -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Reproductor de Video</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <video id="videoPlayer" class="w-100" controls preload="metadata">Tu navegador no soporta video HTML5.</video>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
