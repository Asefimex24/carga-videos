<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carga de Inspección - Doble Video</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Resumable.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/resumable.js/1.1.0/resumable.min.js"></script>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div class="container">
      <div class="card upload-card">
        <div class="card-header-custom">
          <h4 class="mb-1 fw-bold">Subir Videos de Desembolso</h4>
          <p class="mb-0 small opacity-90">Adjunta los videos de Presentación y Firma de Contrato</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form id="form-inspeccion" class="p-4 rounded shadow-sm bg-white border">
            <!-- METADATA DEL REGISTRO -->
            <div class="row mb-4">
              <div class="col-md-4 mb-3">
                <label for="sucursal" class="form-label fw-bold">Sucursal</label>

                <select name="sucursales" id="sucursal" class="form-control">
                  <option value="ACAYUCAN">ACAYUCAN VERACRUZ</option>
                  <option value="AYUTLA">AYUTLA DE LOS LIBRES, GUERRERO</option>
                  <option value="BOCA_DEL_RIO">BOCA DEL RIO, VERACRUZ</option>
                  <option value="CANCUN">CANCUN QUINTANA ROO</option>
                  <option value="CHILPANCINGO">CHILPANCINGO, GUERRERO</option>
                  <option value="CDMX">CIUDAD DE MEXICO</option>
                  <option value="CIUDAD_DEL_CARMEN">CIUDAD DEL CARMEN CAMPECHE</option>
                  <option value="COMITAN">COMITAN DE DOMINGUEZ, CHIAPAS</option>
                  <option value="CUAUTLA">CUAUTLA, MORELOS</option>
                  <option value="ESCARCEGA">ESCARCEGA CAMPECHE</option>
                  <option value="FELIPE_CARRILLO">FELIPE CARRILLO PUERTO, QUINTANA ROO</option>
                  <option value="GUADALAJRA">GUADALAJARA, JALISCO</option>
                  <option value="IZUCAR">IZÚCAR DE MATAMOROS, PUEBLA</option>
                  <option value="JOSE_M_MORELOS">JOSÉ MARÍA MORELOS, Q. ROO</option>
                  <option value="JUCHITAN">JUCHITAN DE ZARAGOZA, OAXACA</option>
                  <option value="JURIDICO">JURIDICO</option>
                  <option value="MANZANILLO">MANZANILLO COLIMA</option>
                  <option value="MARIANO_ESCOBEDO">MARIANO ESCOBEDO, VERACRUZ</option>
                  <option value="MATIAS_ROMERO">MATIAS ROMERO, OAXACA</option>
                  <option value="MENDIZABAL">MENDIZABAL, PUEBLA</option>
                  <option value="MERIDA">MERIDA, YUCATAN</option>
                  <option value="MORELIA">MORELIA, MICHOACAN</option>
                  <option value="OAXACA_2">OAXACA II</option>
                  <option value="OAXACA_1">OAXACA, OAXACA</option>
                  <option value="OCOSINGO">OCOSINGO CHIAPAS</option>
                  <option value="PALENQUE">PALENQUE CHIAPAS</option>
                  <option value="PARAISO">PARAISO TABASCO</option>
                  <option value="PLAYA_DEL_CARMEN">PLAYA DEL CARMEN QROO</option>
                  <option value="PUERTO_ESCONDIDO">PUERTO ESCONDIDO, OAXACA</option>
                  <option value="CAMPECHE">SAN FRANCISCO DE CAMPECHE, CAMPECHE</option>
                  <option value="CHILTEPEC">SAN JOSE CHILTEPEC, OAXACA</option>
                  <option value="TEHUANTEPEC">SANTO DOMINGO TEHUANTEPEC, OAXACA</option>
                  <option value="TAPACHULA">TAPACHULA CHIAPAS</option>
                  <option value="TENOSIQUE">TENOSIQUE, TABASCO</option>
                  <option value="TICUL">TICUL, YUCATAN</option>
                  <option value="TONALA">TONALA, CHIAPAS</option>
                  <option value="TUXTLA_GUTIERREZ">TUXTLA GUTIERREZ, CHIAPAS</option>
                  <option value="URUAPAN">URUAPAN, MICHOACAN</option>
                  <option value="VILLAHERMOSA_2">VILLA HERMOSA TABASCO2</option>
                  <option value="VILLA_LAZARO">VILLA LÁZARO CÁRDENAS, PUEBLA</option>
                  <option value="VILLAHERMOSA_1">VILLAHERMOSA, TABASCO</option>
                  <option value="ZIMATLAN">ZIMATLAN DE ALVAREZ, OAXACA</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="cliente" class="form-label fw-bold">Cliente</label>
                <input type="text" id="cliente" class="form-control" placeholder="Ej. Juan Perez" required />
              </div>
              <div class="col-md-4 mb-3">
                <label for="id_inspeccion" class="form-label fw-bold">Num. Crédito</label>
                <input type="text" id="id_inspeccion" class="form-control" placeholder="Ej. INSP-001" required />
              </div>
            </div>
            <div class="col-md-4 mb-3">
              <label for="cliente" class="form-label fw-bold">Ejecutivo</label>
              <input type="text" id="ejecutivo" class="form-control" placeholder="Ej. Juan Perez" required />
            </div>
            <div class="row mb-4">
              <!-- ZONA UPLOAD 1: PRESENTACIÓN -->
              <div class="col-md-6 mb-3">
                <div class="card border-warning h-100">
                  <div class="card-header bg-warning text-dark fw-bold">Video 1: Presentación</div>
                  <div class="card-body text-center" id="file1-dropzone" style="border: 2px dashed #ffc107; cursor: pointer; background-color: #fffdf5">
                    <p class="mb-2 text-muted">Arrastra el video aquí o haz clic abajo</p>
                    <button type="button" id="file1-browse" class="btn btn-outline-warning text-dark btn-sm mb-2 fw-bold">Seleccionar Video</button>
                    <div id="file1-name" class="fw-bold text-truncate text-secondary my-1"></div>

                    <div class="progress mt-3" style="height: 20px">
                      <div id="file1-progress" class="progress-bar bg-warning text-dark fw-bold" role="progressbar" style="width: 0%">0%</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ZONA UPLOAD 2: CONTRATO -->
              <div class="col-md-6 mb-3">
                <div class="card border-danger h-100">
                  <div class="card-header bg-danger text-white fw-bold">Video 2: Firma de Contrato</div>
                  <div class="card-body text-center" id="file2-dropzone" style="border: 2px dashed #dc3545; cursor: pointer; background-color: #fff8f8">
                    <p class="mb-2 text-muted">Arrastra el video aquí o haz clic abajo</p>
                    <button type="button" id="file2-browse" class="btn btn-outline-danger btn-sm mb-2 fw-bold">Seleccionar Video</button>
                    <div id="file2-name" class="fw-bold text-truncate text-secondary my-1"></div>

                    <div class="progress mt-3" style="height: 20px">
                      <div id="file2-progress" class="progress-bar bg-danger fw-bold" role="progressbar" style="width: 0%">0%</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- BOTÓN PRINCIPAL -->
            <div class="d-grid gap-2 col-md-8 mx-auto mt-4">
              <button type="submit" id="btn-enviar-todo" class="btn btn-lg text-white fw-bold" style="background-color: #d9534f">Enviar Videos</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/resumablejs@1.1.0/resumable.min.js"></script>

    <script src="app.js?v=2"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
