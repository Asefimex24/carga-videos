<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Inspección - Doble Video</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Resumable.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/resumable.js/1.1.0/resumable.min.js"></script>

    <style>
        :root {
            --color-rojo-fuego: #D32F2F;
            --color-naranja-vibrante: #E65100;
            --color-naranja-soft: #F57C00;
            --color-mostaza: #E6A100;
            --color-mostaza-claro: #FFF8E1;
            --color-fondo: #FAF6F0;
        }

        body { background-color: var(--color-fondo); font-family: system-ui, sans-serif; }

        .upload-card {
            max-width: 700px;
            margin: 40px auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(211, 47, 47, 0.12);
            overflow: hidden;
            background-color: #ffffff;
        }

        .card-header-custom {
            background: linear-gradient(135deg, var(--color-rojo-fuego) 0%, var(--color-naranja-vibrante) 100%);
            color: #ffffff;
            padding: 1.75rem 1.5rem;
        }

        .drop-zone {
            border: 2px dashed var(--color-naranja-soft);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background-color: #FFFDF9;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover {
            background-color: var(--color-mostaza-claro);
            border-color: var(--color-rojo-fuego);
        }

        .input-group-text-custom {
            background-color: #FFF3E0;
            color: var(--color-naranja-vibrante);
            border-color: #FFE0B2;
        }

        .btn-custom-submit {
            background: linear-gradient(135deg, var(--color-naranja-vibrante) 0%, var(--color-rojo-fuego) 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px;
        }

        .btn-custom-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--color-rojo-fuego) 0%, var(--color-naranja-vibrante) 100%);
            color: #ffffff;
        }

        .progress-bar-custom {
            background: linear-gradient(90deg, var(--color-mostaza) 0%, var(--color-naranja-vibrante) 50%, var(--color-rojo-fuego) 100%);
        }

        .alert-file-selected {
            background-color: var(--color-mostaza-claro);
            border: 1px solid #FFE082;
            color: #5D4037;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card upload-card">
        
        <div class="card-header-custom">
            <h4 class="mb-1 fw-bold"><i class="bi bi-camera-reels-fill me-2"></i>Carga de Videos de Inspección</h4>
            <p class="mb-0 small opacity-90">Adjunta los videos de Presentación y Firma de Contrato</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <form id="uploadForm" class="needs-validation" novalidate>
                
                <!-- Datos generales -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="cliente" class="form-label fw-bold text-dark">Nombre del Cliente</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-custom"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="cliente" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="sucursal" class="form-label fw-bold text-dark">Sucursal</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-custom"><i class="bi bi-building-fill"></i></span>
                            <select class="form-select" id="sucursal" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="Norte">Sucursal Norte</option>
                                <option value="Sur">Sucursal Sur</option>
                                <option value="Centro">Sucursal Centro</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="fecha" class="form-label fw-bold text-dark">Fecha de Toma</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-custom"><i class="bi bi-calendar-event-fill"></i></span>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="video_id" class="form-label fw-bold text-dark">ID de Inspección</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-custom"><i class="bi bi-hash"></i></span>
                            <input type="text" class="form-control" id="video_id" placeholder="Ej. INSP-2026-001" required>
                        </div>
                    </div>
                </div>

                <hr class="my-4" style="color: var(--color-naranja-soft);">

                <!-- SECCIÓN VIDEO 1: PRESENTACIÓN -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark">1. Video de Presentación del Cliente</label>
                    <div class="drop-zone" id="browseButton1">
                        <i class="bi bi-person-video2 fs-2" style="color: var(--color-naranja-vibrante);"></i>
                        <h6 class="fw-bold mb-0 mt-1">Seleccionar Video de Presentación</h6>
                    </div>
                    <div id="fileInfo1" class="alert alert-file-selected mt-2 d-none align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2" style="color: var(--color-naranja-vibrante);"></i>
                        <span id="fileNameDisplay1" class="fw-bold"></span>
                    </div>
                </div>

                <!-- SECCIÓN VIDEO 2: FIRMA DE CONTRATO -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark">2. Video de Firma de Contrato</label>
                    <div class="drop-zone" id="browseButton2">
                        <i class="bi bi-file-earmark-check-fill fs-2" style="color: var(--color-naranja-vibrante);"></i>
                        <h6 class="fw-bold mb-0 mt-1">Seleccionar Video de Firma</h6>
                    </div>
                    <div id="fileInfo2" class="alert alert-file-selected mt-2 d-none align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2" style="color: var(--color-naranja-vibrante);"></i>
                        <span id="fileNameDisplay2" class="fw-bold"></span>
                    </div>
                </div>

                <!-- Barra de Progreso -->
                <div id="progress-container" class="mt-4 d-none">
                    <div class="d-flex justify-content-between mb-1">
                        <span id="progress-status-text" class="fw-bold" style="color: var(--color-naranja-vibrante);">Subiendo archivos...</span>
                        <span id="progress-text" class="fw-bold" style="color: var(--color-rojo-fuego);">0%</span>
                    </div>
                    <div class="progress" style="height: 14px; background-color: #FFE0B2;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated progress-bar-custom" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>

                <div id="status-msg" class="alert mt-4 d-none" role="alert"></div>

                <div class="mt-4">
                    <button type="submit" id="submitBtn" class="btn btn-custom-submit btn-lg w-100 fw-bold" disabled>
                        <i class="bi bi-cloud-upload-fill me-2"></i>Enviar Ambos Videos y Registro
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    // Instancia 1: Video Presentación
    var r1 = new Resumable({
        target: 'upload.php',
        chunkSize: 10 * 1024 * 1024,
        simultaneousUploads: 3,
        testChunks: false
    });

    // Instancia 2: Video Firma
    var r2 = new Resumable({
        target: 'upload.php',
        chunkSize: 10 * 1024 * 1024,
        simultaneousUploads: 3,
        testChunks: false
    });

    var file1Ready = false;
    var file2Ready = false;

    r1.assignBrowse(document.getElementById('browseButton1'));
    r2.assignBrowse(document.getElementById('browseButton2'));

    // Captura Video 1
    r1.on('fileAdded', function(file) {
        file1Ready = true;
        document.getElementById('fileNameDisplay1').innerText = file.fileName + " (" + (file.size / (1024*1024)).toFixed(1) + " MB)";
        document.getElementById('fileInfo1').classList.remove('d-none');
        document.getElementById('fileInfo1').classList.add('d-flex');
        checkFormReady();
    });

    // Captura Video 2
    r2.on('fileAdded', function(file) {
        file2Ready = true;
        document.getElementById('fileNameDisplay2').innerText = file.fileName + " (" + (file.size / (1024*1024)).toFixed(1) + " MB)";
        document.getElementById('fileInfo2').classList.remove('d-none');
        document.getElementById('fileInfo2').classList.add('d-flex');
        checkFormReady();
    });

    function checkFormReady() {
        if (file1Ready && file2Ready) {
            document.getElementById('submitBtn').disabled = false;
        }
    }

    // Progreso Video 1
    r1.on('fileProgress', function(file) {
        var progress = Math.floor(file.progress() * 50); // Primer video representa del 0% al 50%
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('progress-text').innerText = progress + '%';
    });

    // Al terminar Video 1 -> Inicia Video 2
    r1.on('fileSuccess', function() {
        document.getElementById('progress-status-text').innerText = "Subiendo Video 2: Firma de Contrato...";
        r2.upload();
    });

    // Progreso Video 2
    r2.on('fileProgress', function(file) {
        var progress = 50 + Math.floor(file.progress() * 50); // Segundo video representa del 50% al 100%
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('progress-text').innerText = progress + '%';
    });

    // Al terminar ambos
    r2.on('fileSuccess', function(file, response) {
        var statusDiv = document.getElementById('status-msg');
        statusDiv.className = 'alert alert-success mt-4';
        statusDiv.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>¡Ambos videos y el registro han sido subidos exitosamente a Hetzner!';
        
        document.getElementById('progress-container').classList.add('d-none');
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('uploadForm').reset();
        document.getElementById('fileInfo1').classList.add('d-none');
        document.getElementById('fileInfo2').classList.add('d-none');
        file1Ready = false;
        file2Ready = false;
    });

    // Envío secuencial
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!this.checkValidity()) {
            e.stopPropagation();
            this.classList.add('was-validated');
            return;
        }

        var commonData = {
            cliente: document.getElementById('cliente').value,
            sucursal: document.getElementById('sucursal').value,
            fecha: document.getElementById('fecha').value,
            video_id: document.getElementById('video_id').value
        };

        // Asignar metadatos y tipo de video a cada instancia
        r1.opts.query = Object.assign({}, commonData, { tipo_video: 'presentacion' });
        r2.opts.query = Object.assign({}, commonData, { tipo_video: 'firma_contrato' });

        document.getElementById('progress-container').classList.remove('d-none');
        document.getElementById('status-msg').classList.add('d-none');
        document.getElementById('progress-status-text').innerText = "Subiendo Video 1: Presentación...";
        document.getElementById('submitBtn').disabled = true;

        // Iniciar flujo con el primer video
        r1.upload();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
