<!doctype html>
<html lang="es" class="h-full bg-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos para Desembolso - ASEFI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Bootstrap Icons (conservado por compatibilidad con app.js) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="estilo.css" />
    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Resumable.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/resumable.js/1.1.0/resumable.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style></style>
  </head>

  <body class="min-h-full py-6 sm:py-8 px-3 sm:px-6 lg:px-8">
    <div class="max-w-5xl mx-auto">
      <!-- ENCABEZADO PRINCIPAL -->
      <header class="bg-[#131c2e] text-white rounded-2xl p-5 sm:p-7 mb-6 shadow-md border border-slate-800">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div class="flex items-start space-x-3.5">
            <div class="mt-1 text-blue-400 text-2xl sm:text-3xl shrink-0">
              <i class="fa-solid fa-video"></i>
            </div>
            <div>
              <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight leading-snug">Subir Videos de Desembolso</h1>
              <!-- <p class="text-slate-400 text-xs sm:text-sm mt-0.5">Adjunta los videos de Presentación y Firma de Contrato</p> -->
            </div>
          </div>

          <div class="flex items-center justify-between md:justify-end space-x-3 pt-2 md:pt-0 border-t md:border-t-0 border-slate-700/60">
            <a
              href="../"
              class="bg-slate-800/90 hover:bg-slate-700 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg border border-slate-600 transition-colors flex items-center gap-2 shrink-0"
            >
              <i class="fa-solid fa-arrow-left text-xs"></i>
              <span>Regresar al menú</span>
            </a>
          </div>
        </div>
      </header>

      <!-- FORMULARIO PRINCIPAL -->
      <form id="form-inspeccion">
        <!-- SECCIÓN 1: METADATA DEL REGISTRO -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 sm:p-6 mb-6">
          <div class="flex items-center space-x-2.5 mb-5 pb-3 border-b border-slate-100">
            <i class="fa-solid fa-file-invoice text-blue-600 text-lg"></i>
            <h2 class="text-slate-900 font-bold text-base sm:text-lg">1. Datos del Crédito y Registro</h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4 sm:gap-5">
            <!-- Sucursal -->
            <div>
              <label for="sucursal" class="asefi-label">Sucursal <span class="text-red-500">*</span></label>
              <select name="sucursales" id="sucursal" class="asefi-input cursor-pointer">
                <option value="ACAYUCAN">ACAYUCAN VERACRUZ</option>
                <option value="AYUTLA">AYUTLA DE LOS LIBRES, GUERRERO</option>
                <option value="BOCA_DEL_RIO">BOCA DEL RIO, VERACRUZ</option>
                <option value="CANCUN">CANCUN QUINTANA ROO</option>
                <option value="CHILPANCINGO">CHILPANCINGO, GUERRERO</option>
                <option value="CDMX">CIUDAD DE MEXICO</option>
                <option value="CIUDAD_DEL_CARMEN">CIUDAD DEL CARMEN CAMPECHE</option>
                <option value="COMITAN">COMITAN DE DOMINGUEZ, CHIAPAS</option>
                <option value="CUAUTLA">CUAUTLA, MORELOS</option>
                <option value="ESCARCEGA">ESCARCEGA CAMPECHE</option>
                <option value="FELIPE_CARRILLO">FELIPE CARRILLO PUERTO, QUINTANA ROO</option>
                <option value="GUADALAJRA">GUADALAJARA, JALISCO</option>
                <option value="IZUCAR">IZÚCAR DE MATAMOROS, PUEBLA</option>
                <option value="JOSE_M_MORELOS">JOSÉ MARÍA MORELOS, Q. ROO</option>
                <option value="JUCHITAN">JUCHITAN DE ZARAGOZA, OAXACA</option>
                <option value="JURIDICO">JURIDICO</option>
                <option value="MANZANILLO">MANZANILLO COLIMA</option>
                <option value="MARIANO_ESCOBEDO">MARIANO ESCOBEDO, VERACRUZ</option>
                <option value="MATIAS_ROMERO">MATIAS ROMERO, OAXACA</option>
                <option value="MENDIZABAL">MENDIZABAL, PUEBLA</option>
                <option value="MERIDA">MERIDA, YUCATAN</option>
                <option value="MORELIA">MORELIA, MICHOACAN</option>
                <option value="OAXACA_2">OAXACA II</option>
                <option value="OAXACA_1">OAXACA, OAXACA</option>
                <option value="OCOSINGO">OCOSINGO CHIAPAS</option>
                <option value="PALENQUE">PALENQUE CHIAPAS</option>
                <option value="PARAISO">PARAISO TABASCO</option>
                <option value="PLAYA_DEL_CARMEN">PLAYA DEL CARMEN QROO</option>
                <option value="PUERTO_ESCONDIDO">PUERTO ESCONDIDO, OAXACA</option>
                <option value="CAMPECHE">SAN FRANCISCO DE CAMPECHE, CAMPECHE</option>
                <option value="CHILTEPEC">SAN JOSE CHILTEPEC, OAXACA</option>
                <option value="TEHUANTEPEC">SANTO DOMINGO TEHUANTEPEC, OAXACA</option>
                <option value="TAPACHULA">TAPACHULA CHIAPAS</option>
                <option value="TENOSIQUE">TENOSIQUE, TABASCO</option>
                <option value="TICUL">TICUL, YUCATAN</option>
                <option value="TONALA">TONALA, CHIAPAS</option>
                <option value="TUXTLA_GUTIERREZ">TUXTLA GUTIERREZ, CHIAPAS</option>
                <option value="URUAPAN">URUAPAN, MICHOACAN</option>
                <option value="VILLAHERMOSA_2">VILLA HERMOSA TABASCO2</option>
                <option value="VILLA_LAZARO">VILLA LÁZARO CÁRDENAS, PUEBLA</option>
                <option value="VILLAHERMOSA_1">VILLAHERMOSA, TABASCO</option>
                <option value="ZIMATLAN">ZIMATLAN DE ALVAREZ, OAXACA</option>
              </select>
            </div>

            <!-- Num. Crédito -->
            <div>
              <label for="id_inspeccion" class="asefi-label">Num. Crédito <span class="text-red-500">*</span></label>
              <input type="text" id="id_inspeccion" class="asefi-input font-mono" placeholder="2003647589" required />
            </div>

            <!-- Cliente -->
            <div>
              <label for="cliente" class="asefi-label">Cliente <span class="text-red-500">*</span></label>
              <input type="text" id="cliente" class="asefi-input" placeholder="JUAN PEREZ" required />
            </div>

            <!-- Ejecutivo -->
            <div>
              <label for="ejecutivo" class="asefi-label">Ejecutivo <span class="text-red-500">*</span></label>
              <input type="text" id="ejecutivo" class="asefi-input" placeholder="JUAN GOMEZ" required />
            </div>
            <!-- Fecha desembolso -->
            <div>
              <label for="fechaDesem" class="asefi-label">Fecha de Desembolso <span class="text-red-500">*</span></label>
              <input type="date" id="fechaDesem" class="asefi-input" required />
            </div>
          </div>
        </section>

        <!-- SECCIÓN 2: ZONAS DE CARGA DE VIDEO -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 sm:p-6 mb-8">
          <div class="flex items-center space-x-2.5 mb-5 pb-3 border-b border-slate-100">
            <i class="fa-solid fa-cloud-arrow-up text-blue-600 text-lg"></i>
            <h2 class="text-slate-900 font-bold text-base sm:text-lg">2. Carga de Evidencia en Video</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- ZONA UPLOAD 1: PRESENTACIÓN -->
            <div class="rounded-xl border border-slate-200 bg-slate-50/60 overflow-hidden flex flex-col">
              <div class="bg-slate-800 text-white px-4 py-3 flex items-center justify-between">
                <span class="font-semibold text-sm flex items-center gap-2">
                  <i class="fa-solid fa-user-tie text-blue-400"></i>
                  Video 1: Presentación
                </span>
                <span class="text-xs bg-slate-700 text-slate-200 px-2 py-0.5 rounded font-medium">Requerido</span>
              </div>

              <div
                id="file1-dropzone"
                class="p-6 text-center flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-blue-500 hover:bg-blue-50/40 m-3 rounded-lg cursor-pointer transition-colors"
              >
                <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-3">
                  <i class="fa-solid fa-film text-xl"></i>
                </div>
                <p class="text-sm text-slate-600 mb-3">Arrastra el video aquí o haz clic abajo</p>

                <button
                  type="button"
                  id="file1-browse"
                  class="px-4 py-2 rounded-lg bg-white border border-slate-300 hover:border-blue-500 hover:text-blue-600 text-slate-700 text-xs font-semibold shadow-sm transition-colors"
                >
                  <i class="fa-solid fa-folder-open mr-1.5"></i>Seleccionar Video
                </button>

                <div id="file1-name" class="text-xs font-semibold text-slate-700 truncate max-w-full mt-3 px-2"></div>

                <!-- Barra de progreso -->
                <div class="w-full bg-slate-200 rounded-full h-5 mt-4 overflow-hidden shadow-inner">
                  <div id="file1-progress" class="progress-bar-fill bg-blue-600 h-5 text-xs font-bold text-white flex items-center justify-center" role="progressbar" style="width: 0%">0%</div>
                </div>
              </div>
            </div>

            <!-- ZONA UPLOAD 2: CONTRATO -->
            <div class="rounded-xl border border-slate-200 bg-slate-50/60 overflow-hidden flex flex-col">
              <div class="bg-slate-800 text-white px-4 py-3 flex items-center justify-between">
                <span class="font-semibold text-sm flex items-center gap-2">
                  <i class="fa-solid fa-file-signature text-indigo-400"></i>
                  Video 2: Firma de Contrato
                </span>
                <span class="text-xs bg-slate-700 text-slate-200 px-2 py-0.5 rounded font-medium">Requerido</span>
              </div>

              <div
                id="file2-dropzone"
                class="p-6 text-center flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/40 m-3 rounded-lg cursor-pointer transition-colors"
              >
                <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mb-3">
                  <i class="fa-solid fa-file-video text-xl"></i>
                </div>
                <p class="text-sm text-slate-600 mb-3">Arrastra el video aquí o haz clic abajo</p>

                <button
                  type="button"
                  id="file2-browse"
                  class="px-4 py-2 rounded-lg bg-white border border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-700 text-xs font-semibold shadow-sm transition-colors"
                >
                  <i class="fa-solid fa-folder-open mr-1.5"></i>Seleccionar Video
                </button>

                <div id="file2-name" class="text-xs font-semibold text-slate-700 truncate max-w-full mt-3 px-2"></div>

                <!-- Barra de progreso -->
                <div class="w-full bg-slate-200 rounded-full h-5 mt-4 overflow-hidden shadow-inner">
                  <div id="file2-progress" class="progress-bar-fill bg-indigo-600 h-5 text-xs font-bold text-white flex items-center justify-center" role="progressbar" style="width: 0%">0%</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- BOTÓN PRINCIPAL -->
        <div class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-2">
          <button
            type="submit"
            id="btn-enviar-todo"
            class="w-full sm:w-auto px-8 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors shadow-sm flex items-center justify-center space-x-2"
          >
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Enviar Videos</span>
          </button>
        </div>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
